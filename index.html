<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Calculadora de Sensibilidade Blood Strike</title>
    <style>
        :root {
            --primary: #00e5ff; --bg: #0d1117; --card: #161b22;
            --border: #30363d; --text-main: #f0f6fc; --text-dim: #8b949e;
            --accent-gyro: #a371f7; --accent-y: #ff7b72; --accent-x: #79c0ff; --accent-orange: #d29922; --pix: #00ff73;
        }

        body { 
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Arial, sans-serif; 
            background-color: var(--bg); 
            color: var(--text-main); 
            margin: 0; 
            display: flex; 
            flex-direction: column;
            justify-content: center; 
            align-items: center;
            min-height: 100vh;
            padding: 20px;
            box-sizing: border-box;
        }

        .app-container { width: 100%; max-width: 550px; }
        
        .header { text-align: center; margin-bottom: 25px; }
        .header h1 { font-size: 18px; text-transform: uppercase; letter-spacing: 2px; color: var(--primary); margin: 0; font-weight: 800; }
        
        .card { background: var(--card); border: 1px solid var(--border); border-radius: 12px; padding: 20px; margin-bottom: 20px; box-shadow: 0 4px 20px rgba(0,0,0,0.3); }
        .section-label { font-size: 11px; font-weight: 600; color: var(--primary); text-transform: uppercase; letter-spacing: 1px; margin-bottom: 16px; display: block; }
        
        .input-row { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; margin-bottom: 12px; }
        .field-group { display: flex; flex-direction: column; }
        label { font-size: 10px; color: var(--text-dim); margin-bottom: 5px; text-transform: uppercase; }
        input, select { background: #010409; border: 1px solid var(--border); color: #fff; padding: 10px; border-radius: 6px; font-size: 13px; }
        
        .mode-selector { display: flex; gap: 10px; margin-bottom: 20px; }
        .mode-btn { flex: 1; padding: 12px; border-radius: 6px; border: 1px solid var(--border); background: #010409; color: var(--text-dim); cursor: pointer; font-size: 11px; font-weight: 700; text-transform: uppercase; transition: 0.3s; }
        .mode-btn.active { border-color: var(--primary); color: var(--primary); background: rgba(0, 229, 255, 0.05); }

        button.main-calc { width: 100%; background: var(--primary); color: #0d1117; border: none; padding: 16px; border-radius: 6px; font-weight: 800; font-size: 14px; text-transform: uppercase; cursor: pointer; transition: 0.2s; margin-bottom: 10px; }
        
        .results-area { display: none; width: 100%; }
        
        table { width: 100%; border-collapse: collapse; margin-top: 10px; }
        th { font-size: 9px; color: var(--text-dim); padding-bottom: 8px; text-transform: uppercase; border-bottom: 1px solid var(--border); text-align: center; }
        td { padding: 12px 5px; border-bottom: 1px solid var(--border); font-size: 13px; text-align: center; }
        .mira-name { text-align: left; font-weight: bold; color: var(--text-main); }
        
        .val-std-cam { color: var(--primary); font-weight: 800; }
        .val-std-dis { color: var(--accent-orange); font-weight: 800; }
        .val-x { color: var(--accent-x); font-weight: 800; }
        .val-y { color: var(--accent-y); font-weight: 800; }
        .val-gyro { color: var(--accent-gyro); font-weight: 800; }

        .highlight-box { background: rgba(163, 113, 247, 0.05); border: 1px solid var(--accent-gyro); border-radius: 8px; padding: 12px; margin-bottom: 15px; display: flex; justify-content: space-between; align-items: center; }
        .deadzone-box { background: rgba(163, 113, 247, 0.03); border: 1px dashed var(--accent-gyro); border-radius: 8px; padding: 15px; margin-top: 15px; text-align: center; }
        
        .footer { text-align: center; font-size: 11px; color: var(--text-dim); margin-top: 30px; padding-bottom: 20px; width: 100%; }
        
        .donate-btn { 
            display: inline-flex; align-items: center; justify-content: center; 
            border: 1px solid var(--pix); color: var(--pix); 
            padding: 10px 25px; border-radius: 30px; text-decoration: none; 
            font-weight: 800; font-size: 11px; margin-top: 15px; 
            transition: 0.3s; text-transform: uppercase;
        }
        .donate-btn:hover { background: var(--pix); color: #000; box-shadow: 0 0 20px rgba(0, 255, 115, 0.3); }
    </style>
</head>
<body>

<div class="app-container">
    <div class="header">
        <h1>Calculadora de Sensibilidade Blood Strike</h1>
    </div>

    <div class="mode-selector">
        <button class="mode-btn active" onclick="setMode('basico', this)">Básica</button>
        <button class="mode-btn" onclick="setMode('avancado', this)">Avançada (X/Y)</button>
    </div>

    <div class="card">
        <span class="section-label">Configurações Base</span>
        <div class="input-row">
            <div class="field-group"><label>Sensi Geral (Tela)</label><input type="number" id="sensiTela" value="122"></div>
            <div class="field-group"><label>FOV</label><input type="number" id="fov" value="75"></div>
        </div>
        <div class="input-row">
            <div class="field-group">
                <label>Modo de FOV</label>
                <select id="tipoFov">
                    <option value="independente">Independente</option>
                    <option value="associado">Associado</option>
                </select>
            </div>
            <div class="field-group">
                <label>Aceleração</label>
                <select id="tipoAcel" onchange="toggleImpulso()">
                    <option value="fixa">Velocidade Fixa</option>
                    <option value="distancia">Distância</option>
                    <option value="velocidade">Velocidade</option>
                </select>
            </div>
        </div>
        <div class="input-row">
            <div class="field-group" id="impulsoContainer" style="display:none;">
                <label>Valor do Impulso</label>
                <input type="number" id="valorImpulso" value="0">
            </div>
            <div class="field-group" id="estabilizaContainer" style="display:none;">
                <label>Estabilização Y (%)</label>
                <input type="number" id="estabilizaY" value="115">
            </div>
        </div>
    </div>

    <button class="main-calc" onclick="calcularTudo()">Gerar Configurações</button>

    <div class="results-area" id="resultsArea">
        <div class="card">
            <span class="section-label">Tela</span>
            <table id="tableHeaderStd">
                <thead><tr><th style="text-align:left;">Mira</th><th>Câmera</th><th>Disparo</th></tr></thead>
                <tbody id="corpoBasico"></tbody>
            </table>
            <table id="tableHeaderAdv" style="display:none;">
                <thead>
                    <tr><th rowspan="2" style="text-align:left;">Mira</th><th colspan="2">Câmera</th><th colspan="2">Disparo</th></tr>
                    <tr><th>X</th><th>Y</th><th>X</th><th>Y</th></tr>
                </thead>
                <tbody id="corpoAvancado"></tbody>
            </table>
        </div>

        <div class="card" style="border-left: 4px solid var(--accent-gyro);">
            <span class="section-label" style="color:var(--accent-gyro)">Giroscópio</span>
            <div class="highlight-box">
                <span style="color:var(--accent-gyro); font-size: 10px; font-weight: bold;">GERAL DO GIRO</span>
                <span id="resGeralGiro" style="color:var(--accent-gyro); font-size: 18px; font-weight: 800;">--</span>
            </div>
            <table>
                <thead><tr><th style="text-align:left;">Mira</th><th>Câmera</th><th>Disparo</th></tr></thead>
                <tbody id="corpoGiro"></tbody>
            </table>
            <div class="deadzone-box">
                <label style="color: var(--text-dim); font-size: 9px; text-transform: uppercase;">Zona Morta Sugerida</label>
                <span id="deadzoneVal" style="color:var(--accent-gyro); font-size: 20px; font-weight: 800; display:block;">--</span>
            </div>
        </div>
    </div>

    <div class="footer">
        POWERED BY BITTECH<br>
        <a href="https://pixgg.com/yoshizitu" target="_blank" class="donate-btn">
            Apoie no PixGG
        </a>
    </div>
</div>

<script>
    let currentMode = 'basico';

    function setMode(mode, btn) {
        currentMode = mode;
        document.querySelectorAll('.mode-btn').forEach(b => b.classList.remove('active'));
        btn.classList.add('active');
        document.getElementById('estabilizaContainer').style.display = (mode === 'avancado') ? 'block' : 'none';
        document.getElementById('resultsArea').style.display = 'none';
    }

    function toggleImpulso() {
        const tipo = document.getElementById('tipoAcel').value;
        document.getElementById('impulsoContainer').style.display = (tipo === 'fixa') ? 'none' : 'block';
    }

    function calcularTudo() {
        const sensiTela = parseFloat(document.getElementById('sensiTela').value);
        const fov = parseFloat(document.getElementById('fov').value);
        const fovTipo = document.getElementById('tipoFov').value;
        const acelTipo = document.getElementById('tipoAcel').value;
        const impulsoVal = parseFloat(document.getElementById('valorImpulso').value) || 0;
        const estabY = parseFloat(document.getElementById('estabilizaY').value) / 100;
        
        const fovRatio = fov / 90;
        const acelMod = (acelTipo !== 'fixa') ? (1 - (impulsoVal / 500)) : 1;
        let sensiGiroBase = Math.min(Math.round(sensiTela * 2.1), 300);

        const miras = [
            { n: "Ferro / Red Dot", m: 0.85, isSniper: false },
            { n: "Postura Tática", m: 0.80, isSniper: false },
            { n: "Mira 2x", m: 0.65, isSniper: false },
            { n: "Mira 3x", m: 0.55, isSniper: false },
            { n: "Mira 4x", m: 0.76, isSniper: true }, 
            { n: "Mira 6x", m: 0.70, isSniper: true }, 
            { n: "Mira 8x", m: 0.6558, isSniper: true } 
        ];

        let hBasico = ''; let hAvancado = ''; let hGiro = '';

        miras.forEach(item => {
            let baseSensi;
            if (item.isSniper) {
                let comp = (fovTipo === 'associado') ? (1 / fovRatio) : 1;
                baseSensi = sensiTela * item.m * (fovTipo === 'associado' ? comp : 1) * acelMod;
            } else {
                let fovMod = (fovTipo === 'associado') ? (1 + (fov - 60) / 220) : 1;
                baseSensi = sensiTela * item.m * fovRatio * fovMod * acelMod;
            }

            let camStd = Math.round(baseSensi);
            let disStd = Math.round(camStd * 0.95);

            hBasico += `<tr><td class="mira-name">${item.n}</td><td class="val-std-cam">${camStd}</td><td class="val-std-dis">${disStd}</td></tr>`;
            
            let cx = camStd; let cy = Math.round(camStd * estabY);
            let dx = Math.round(cx * 0.95); let dy = Math.round(cy * 1.05);
            hAvancado += `<tr><td class="mira-name">${item.n}</td><td class="val-x">${cx}</td><td class="val-y">${cy}</td><td class="val-x">${dx}</td><td class="val-y">${dy}</td></tr>`;

            let camG = Math.min(Math.round(sensiGiroBase * item.m), 300);
            let disG = Math.min(Math.round(camG * 0.98), 300);
            hGiro += `<tr><td class="mira-name">${item.n}</td><td class="val-gyro">${camG}</td><td class="val-gyro" style="color:#f0f6fc">${disG}</td></tr>`;
        });

        document.getElementById('tableHeaderStd').style.display = (currentMode === 'basico') ? 'table' : 'none';
        document.getElementById('tableHeaderAdv').style.display = (currentMode === 'avancado') ? 'table' : 'none';
        document.getElementById('corpoBasico').innerHTML = hBasico;
        document.getElementById('corpoAvancado').innerHTML = hAvancado;
        document.getElementById('resGeralGiro').innerText = sensiGiroBase;
        document.getElementById('corpoGiro').innerHTML = hGiro;
        document.getElementById('deadzoneVal').innerText = Math.min(Math.max(Math.floor((sensiGiroBase / 35) + (sensiTela / 80)), 2), 12);
        document.getElementById('resultsArea').style.display = 'block';
    }
</script>
</body>
</html>
